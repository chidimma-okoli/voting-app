apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/chidimma-okoli/voting-app-result:7fced42a63415e48710d77f6b42ec73e0ed8d991
        name: result
        ports:
        - containerPort: 80
          name: result
