apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/chidimma-okoli/voting-app-vote:7fced42a63415e48710d77f6b42ec73e0ed8d991
        name: vote
        ports:
        - containerPort: 80
          name: vote
